<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <!-- 定义样式 -->
  <defs>
    <!-- 箭头标记 -->
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1976D2" />
    </marker>
  </defs>

  <!-- 标题 -->
  <!-- ========== 左侧：技术难点 ========== -->
  <rect x="50" y="70" width="420" height="580" rx="6" fill="none" stroke="#E65100" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="70" y="100" font-size="16" font-weight="bold" fill="#E65100" font-family="SimHei, Microsoft YaHei, Arial">技术难点</text>

  <!-- 难点1 -->
  <rect x="80" y="120" width="360" height="140" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="2"/>
  <text x="260" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#B71C1C" font-family="SimHei, Microsoft YaHei, Arial">难点1：航空领域语义理解专业性屏障</text>
  <g font-size="11" fill="#C62828" font-family="SimHei, Microsoft YaHei, Arial">
    <text x="100" y="170">• 术语体系庞杂且精确性要求极高（ADIRU、FMS、TCAS、DAL、</text>
    <text x="110" y="188">WCET、MC/DC等）</text>
    <text x="100" y="208">• 通用预训练模型领域概念理解偏差显著</text>
    <text x="100" y="226">• 要素提取F1值难以突破0.70阈值</text>
    <text x="100" y="244">• 中英混写文档处理准确率下降</text>
  </g>

  <!-- 难点2 -->
  <rect x="80" y="280" width="360" height="160" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="2"/>
  <text x="260" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#B71C1C" font-family="SimHei, Microsoft YaHei, Arial">难点2：多维度逻辑冲突检测复杂性</text>
  <g font-size="11" fill="#C62828" font-family="SimHei, Microsoft YaHei, Arial">
    <text x="100" y="330">• 跨层级冲突：系统需求与低层设计不一致</text>
    <text x="100" y="348">• 时序冲突：循环依赖导致可调度性违例</text>
    <text x="100" y="366">• 资源冲突：多子系统竞争总线带宽</text>
    <text x="100" y="384">• 约束冲突：冗余切换条件相互矛盾</text>
    <text x="100" y="402">• 传统规则引擎难构建完备规则集</text>
    <text x="100" y="420">• 机器学习小样本条件下泛化能力不足</text>
  </g>

  <!-- 难点3 -->
  <rect x="80" y="460" width="360" height="170" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="2"/>
  <text x="260" y="485" text-anchor="middle" font-size="14" font-weight="bold" fill="#B71C1C" font-family="SimHei, Microsoft YaHei, Arial">难点3：形式化验证与自然语言语义鸿沟</text>
  <g font-size="11" fill="#C62828" font-family="SimHei, Microsoft YaHei, Arial">
    <text x="100" y="510">• DO-178C要求严格逻辑表达以保证可验证性</text>
    <text x="100" y="530">• 95%以上需求文档采用非结构化自然语言</text>
    <text x="100" y="550">• 自动形式化转换的语义保真性难以保证</text>
    <text x="100" y="570">• 工程师可读性与机器可验证性矛盾</text>
    <text x="100" y="590">• 需求变更频繁导致形式化模型维护困难</text>
    <text x="100" y="610">• 缺乏有效的中间表示层桥接两者鸿沟</text>
  </g>

  <!-- ========== 中间：突破路径箭头 ========== -->
  <g>
    <!-- 箭头1 -->
    <line x1="490" y1="190" x2="710" y2="190" stroke="#1976D2" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="590" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0" font-family="SimHei, Microsoft YaHei, Arial">领域知识增强</text>

    <!-- 箭头2 -->
    <line x1="490" y1="360" x2="710" y2="360" stroke="#1976D2" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="590" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0" font-family="SimHei, Microsoft YaHei, Arial">多源推理融合</text>

    <!-- 箭头3 -->
    <line x1="490" y1="545" x2="710" y2="545" stroke="#1976D2" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="590" y="535" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0" font-family="SimHei, Microsoft YaHei, Arial">双向可追溯转换</text>
  </g>

  <!-- ========== 右侧：关键技术 ========== -->
  <rect x="730" y="70" width="420" height="580" rx="6" fill="none" stroke="#1976D2" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="750" y="100" font-size="16" font-weight="bold" fill="#1976D2" font-family="SimHei, Microsoft YaHei, Arial">关键技术突破</text>

  <!-- 关键技术1 -->
  <rect x="760" y="120" width="360" height="140" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="940" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#01579B" font-family="SimHei, Microsoft YaHei, Arial">技术1：航空领域知识增强语义理解</text>
  <g font-size="11" fill="#0277BD" font-family="SimHei, Microsoft YaHei, Arial">
    <text x="780" y="170">• 基于ERNIE 3.0 / ChatGLM2-6B 小模型，进行领域持续预训练</text>
    <text x="790" y="188">与LoRA微调</text>
    <text x="780" y="206">• 航空术语词典：≥5000条专业术语</text>
    <text x="780" y="224">• Neo4j知识图谱：≥10⁵条关系边</text>
    <text x="780" y="242">• 性能目标：要素提取F1≥0.75</text>
  </g>

  <!-- 关键技术2 -->
  <rect x="760" y="280" width="360" height="160" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="940" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#01579B" font-family="SimHei, Microsoft YaHei, Arial">技术2：多源异构冲突检测推理融合</text>
  <g font-size="11" fill="#0277BD" font-family="SimHei, Microsoft YaHei, Arial">
    <text x="780" y="330">• Drools规则引擎：覆盖≥30类冲突模式</text>
    <text x="780" y="348">• Z3/CVC5 SMT求解器：时序约束验证</text>
    <text x="780" y="366">• 知识图谱推理：依赖传播与影响分析</text>
    <text x="780" y="384">• 三层架构：规则驱动+逻辑验证+图推理</text>
    <text x="780" y="402">• 性能目标：召回率≥90%</text>
    <text x="780" y="420">• 质量目标：假阳性率≤15%</text>
  </g>

  <!-- 关键技术3 -->
  <rect x="760" y="460" width="360" height="170" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="940" y="485" text-anchor="middle" font-size="14" font-weight="bold" fill="#01579B" font-family="SimHei, Microsoft YaHei, Arial">技术3：自然语言-形式化规约双向转换</text>
  <g font-size="11" fill="#0277BD" font-family="SimHei, Microsoft YaHei, Arial">
    <text x="780" y="510">• 构建中间表示层（关系模板），支持依赖/互斥/时序窗口/</text>
    <text x="790" y="528">冗余策略等</text>
    <text x="780" y="546">• 保持工程师可读性与DO-178C可验证性</text>
    <text x="780" y="564">• 可视化编辑界面：人机协同优化</text>
    <text x="780" y="582">• 自动生成形式化逻辑表达</text>
    <text x="780" y="600">• 性能目标：建模延迟≤15秒</text>
    <text x="780" y="618">• 支持需求变更增量更新≤60秒</text>
  </g>
</svg>