<svg viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- 定义样式 -->
  <defs>
    <!-- 箭头标记 -->
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1976D2" />
    </marker>
  </defs>

  <!-- 标题 -->

  <!-- ========== 输入层 ========== -->
  <!-- 输入层外框 -->
  <rect x="80" y="50" width="1040" height="110" rx="6" fill="none" stroke="#1976D2" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="100" y="75" font-size="14" font-weight="bold" fill="#0D47A1" font-family="SimHei, Microsoft YaHei, Arial">输入层</text>

  <!-- 输入框组 -->
  <rect x="150" y="80" width="280" height="70" rx="6" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="290" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#01579B" font-family="SimHei, Microsoft YaHei, Arial">自然语言需求文档</text>
  <text x="290" y="125" text-anchor="middle" font-size="11" fill="#0277BD" font-family="SimHei, Microsoft YaHei, Arial">Word/PDF/纯文本</text>
  <text x="290" y="142" text-anchor="middle" font-size="11" fill="#0277BD" font-family="SimHei, Microsoft YaHei, Arial">中英混写、专业术语</text>

  <rect x="460" y="80"  width="280" height="70" rx="6" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="600" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#01579B" font-family="SimHei, Microsoft YaHei, Arial">结构化需求数据</text>
  <text x="600" y="125" text-anchor="middle" font-size="11" fill="#0277BD" font-family="SimHei, Microsoft YaHei, Arial">Excel/XML/JSON</text>
  <text x="600" y="142" text-anchor="middle" font-size="11" fill="#0277BD" font-family="SimHei, Microsoft YaHei, Arial">现有系统导入接口</text>

  <rect x="770" y="80"  width="280" height="70" rx="6" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="910" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#01579B" font-family="SimHei, Microsoft YaHei, Arial">现有需求库</text>
  <text x="910" y="125" text-anchor="middle" font-size="11" fill="#0277BD" font-family="SimHei, Microsoft YaHei, Arial">DOORS/Jama集成</text>
  <text x="910" y="142" text-anchor="middle" font-size="11" fill="#0277BD" font-family="SimHei, Microsoft YaHei, Arial">历史项目需求迁移</text>

  <!-- 输入层到核心处理层的3条箭头 -->
  <line x1="290" y1="160" x2="290" y2="200" stroke="#1976D2" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="160" x2="600" y2="200" stroke="#1976D2" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <line x1="910" y1="160" x2="910" y2="200" stroke="#1976D2" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- ========== 核心处理层 ========== -->
  <!-- 核心处理层外框 -->
  <rect x="80" y="200" width="1040" height="450" rx="6" fill="none" stroke="#1976D2" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="100" y="225" font-size="14" font-weight="bold" fill="#0D47A1" font-family="SimHei, Microsoft YaHei, Arial">核心处理层</text>

  <!-- 模块1：需求语义解析 -->
  <rect x="150" y="240" width="900" height="90" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
  <text x="600" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#01579B" font-family="SimHei, Microsoft YaHei, Arial">① 需求语义解析模块</text>
  <g font-size="11" fill="#0277BD" font-family="SimHei, Microsoft YaHei, Arial">
    <text x="180" y="282">• 领域预训练模型：ERNIE 3.0 / ChatGLM2-6B</text>
    <text x="580" y="282">• NER实体识别：功能点、性能指标（F1≥0.75）</text>
    <text x="180" y="302">• 歧义识别：模糊词汇检测与澄清建议（召回率≥0.80）</text>
    <text x="580" y="302">• 需求分类：功能性/非功能性自动分类</text>
    <text x="180" y="322">• 多层级映射：支持系统需求-HLR-LLR分解</text>
  </g>

  <!-- 箭头：模块1到模块2 -->
  <line x1="600" y1="330" x2="600" y2="365" stroke="#1976D2" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="620" y="357" font-size="10" fill="#1565C0" font-family="SimHei, Microsoft YaHei, Arial">结构化要素</text>

  <!-- 模块2：规约逻辑建模 -->
  <rect x="150" y="370" width="900" height="90" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
  <text x="600" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#01579B" font-family="SimHei, Microsoft YaHei, Arial">② 规约逻辑建模模块</text>
  <g font-size="11" fill="#0277BD" font-family="SimHei, Microsoft YaHei, Arial">
    <text x="180" y="412">• 知识图谱：Neo4j构建（≥10⁵条关系边）</text>
    <text x="580" y="412">• 规则模板：依赖/互斥/包含/时序窗口</text>
    <text x="180" y="432">• 可视化编辑：拖拽式逻辑关系调整，实时语法检查</text>
    <text x="580" y="432">• 版本管理：增量更新延迟≤60s</text>
    <text x="180" y="452">• 冗余策略：支持安全关键系统冗余切换规约</text>
  </g>

  <!-- 箭头：模块2到模块3和4 -->
  <line x1="360" y1="460" x2="360" y2="500" stroke="#1976D2" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="370" y="485" font-size="10" fill="#1565C0" font-family="SimHei, Microsoft YaHei, Arial">需求模型</text>
  <line x1="840" y1="460" x2="840" y2="500" stroke="#1976D2" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="850" y="485" font-size="10" fill="#1565C0" font-family="SimHei, Microsoft YaHei, Arial">逻辑规约</text>

  <!-- 模块3和4并列 -->
  <rect x="150" y="505" width="420" height="130" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
  <text x="360" y="527" text-anchor="middle" font-size="14" font-weight="bold" fill="#01579B" font-family="SimHei, Microsoft YaHei, Arial">③ 需求文档生成模块</text>
  <g font-size="11" fill="#0277BD" font-family="SimHei, Microsoft YaHei, Arial">
    <text x="180" y="547">• 标准模板：DO-178C SRS/HLR/LLR</text>
    <text x="180" y="567">• 接口文档：ICD字段/单位/刷新率</text>
    <text x="180" y="587">• 差异比对：版间变更可视化</text>
    <text x="180" y="607">• 批量导出：结构性错误率≤1%</text>
    <text x="180" y="627">• 符合性验证：ARP4754A标准检查</text>
  </g>

  <rect x="630" y="505" width="420" height="130" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
  <text x="840" y="527" text-anchor="middle" font-size="14" font-weight="bold" fill="#01579B" font-family="SimHei, Microsoft YaHei, Arial">④ 冲突检测与消解模块</text>
  <g font-size="11" fill="#0277BD" font-family="SimHei, Microsoft YaHei, Arial">
    <text x="660" y="547">• 规则引擎：Drools + SMT求解器</text>
    <text x="660" y="567">• 冲突类型：≥30类（接口/资源/时序）</text>
    <text x="660" y="587">• 检测效率：全量≤90min，增量≤5min</text>
    <text x="660" y="607">• 消解建议：优先级调整/预算重平衡</text>
    <text x="660" y="627">• 影响分析：变更传播路径可视化</text>
  </g>

  <!-- 核心处理层到支撑层的箭头 -->
  <line x1="600" y1="650" x2="600" y2="690" stroke="#1976D2" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- ========== 支撑层 ========== -->
  <rect x="80" y="690" width="1040" height="90" rx="6" fill="none" stroke="#1976D2" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="100" y="715" font-size="14" font-weight="bold" fill="#0D47A1" font-family="SimHei, Microsoft YaHei, Arial">支撑层</text>

  <rect x="150" y="725" width="900" height="40" rx="6" fill="#E3F2FD" stroke="#0277BD" stroke-width="2"/>
  <g font-size="11" fill="#0277BD" font-family="SimHei, Microsoft YaHei, Arial">
    <text x="180" y="745">• 航空知识图谱与规则库（领域术语、约束模板、DO-178C合规规则）</text>
    <text x="720" y="745">• 取证级双向追溯（需求-测试-代码-变更）</text>
  </g>

  <!-- 支撑层到输出层的3条箭头 -->
  <line x1="360" y1="780" x2="360" y2="820" stroke="#1976D2" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="780" x2="600" y2="820" stroke="#1976D2" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <line x1="840" y1="780" x2="840" y2="820" stroke="#1976D2" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- ========== 输出层 ========== -->
  <rect x="80" y="820" width="1040" height="160" rx="6" fill="none" stroke="#1976D2" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="100" y="845" font-size="14" font-weight="bold" fill="#0D47A1" font-family="SimHei, Microsoft YaHei, Arial">输出层</text>

  <rect x="150" y="865" width="280" height="100" rx="6" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="290" y="887" text-anchor="middle" font-size="13" font-weight="bold" fill="#01579B" font-family="SimHei, Microsoft YaHei, Arial">需求规格说明书</text>
  <text x="290" y="907" text-anchor="middle" font-size="11" fill="#0277BD" font-family="SimHei, Microsoft YaHei, Arial">SRS（HLR/LLR）</text>
  <text x="290" y="925" text-anchor="middle" font-size="11" fill="#0277BD" font-family="SimHei, Microsoft YaHei, Arial">ICD接口控制文档</text>
  <text x="290" y="943" text-anchor="middle" font-size="11" fill="#0277BD" font-family="SimHei, Microsoft YaHei, Arial">试验需求文档</text>
  <text x="290" y="961" text-anchor="middle" font-size="11" fill="#0277BD" font-family="SimHei, Microsoft YaHei, Arial">符合DO-178C标准</text>

  <rect x="460" y="865" width="280" height="100" rx="6" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="600" y="887" text-anchor="middle" font-size="13" font-weight="bold" fill="#01579B" font-family="SimHei, Microsoft YaHei, Arial">冲突检测报告</text>
  <text x="600" y="907" text-anchor="middle" font-size="11" fill="#0277BD" font-family="SimHei, Microsoft YaHei, Arial">冲突分类与分级</text>
  <text x="600" y="925" text-anchor="middle" font-size="11" fill="#0277BD" font-family="SimHei, Microsoft YaHei, Arial">定位到具体需求条目</text>
  <text x="600" y="943" text-anchor="middle" font-size="11" fill="#0277BD" font-family="SimHei, Microsoft YaHei, Arial">消解建议与处置方案</text>
  <text x="600" y="961" text-anchor="middle" font-size="11" fill="#0277BD" font-family="SimHei, Microsoft YaHei, Arial">影响分析矩阵</text>

  <rect x="770" y="865" width="280" height="100" rx="6" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="910" y="887" text-anchor="middle" font-size="13" font-weight="bold" fill="#01579B" font-family="SimHei, Microsoft YaHei, Arial">追溯矩阵与合规证据</text>
  <text x="910" y="907" text-anchor="middle" font-size="11" fill="#0277BD" font-family="SimHei, Microsoft YaHei, Arial">需求-测试-代码双向追溯</text>
  <text x="910" y="925" text-anchor="middle" font-size="11" fill="#0277BD" font-family="SimHei, Microsoft YaHei, Arial">覆盖率统计与缺失标识</text>
  <text x="910" y="943" text-anchor="middle" font-size="11" fill="#0277BD" font-family="SimHei, Microsoft YaHei, Arial">变更影响分析报告</text>
  <text x="910" y="961" text-anchor="middle" font-size="11" fill="#0277BD" font-family="SimHei, Microsoft YaHei, Arial">阶段审查证据索引</text>
</svg>